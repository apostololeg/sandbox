name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build:prod

      - name: Package deploy
        run: |
          mkdir -p dist-deploy
          cp -R build/. dist-deploy/
          cp -R server prisma content dist-deploy/
          cp package.json yarn.lock babel.config.js dist-deploy/
          mkdir -p dist-deploy/.github/systemd
          cp .github/systemd/sandbox.service dist-deploy/.github/systemd/
          tar -czf deploy.tar.gz -C dist-deploy .

      - name: Upload to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          port: ${{ vars.VPS_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy.tar.gz
          target: /tmp

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          DEPLOY_USER: ${{ vars.VPS_USER }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          port: ${{ vars.VPS_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_PATH,DEPLOY_USER,DATABASE_URL
          script: |
            set -e
            sudo mkdir -p "$DEPLOY_PATH"
            sudo chown "$USER:$USER" "$DEPLOY_PATH"
            TMP_DIR=$(mktemp -d)
            tar -xzf /tmp/deploy.tar.gz -C "$TMP_DIR"
            rsync -a --delete --exclude='.env' "$TMP_DIR"/ "$DEPLOY_PATH"/
            rm -rf "$TMP_DIR" /tmp/deploy.tar.gz
            cd "$DEPLOY_PATH"

            if [ -n "${DATABASE_URL:-}" ]; then
              if [ -f .env ] && grep -q '^DATABASE_URL=' .env; then
                sed -i "s|^DATABASE_URL=.*|DATABASE_URL='$DATABASE_URL'|" .env
              else
                echo "DATABASE_URL='$DATABASE_URL'" >> .env
              fi
              chmod 600 .env
            fi

            if [ ! -s .env ] || ! grep -q '^DATABASE_URL=' .env; then
              echo "ERROR: DATABASE_URL missing. Set GitHub secret DATABASE_URL or place .env on the VPS."
              exit 1
            fi

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            yarn install --frozen-lockfile --production=false
            yarn prisma migrate deploy
            yarn seed

            sed -e "s|{{VPS_DEPLOY_PATH}}|$DEPLOY_PATH|g" -e "s|{{VPS_USER}}|$DEPLOY_USER|g" \
              .github/systemd/sandbox.service | sudo tee /etc/systemd/system/sandbox.service > /dev/null
            sudo systemctl daemon-reload
            sudo systemctl enable sandbox
            sudo systemctl restart sandbox
