name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build:prod

      - name: Package source
        run: |
          tar -czf deploy.tar.gz \
            --exclude=build/uploads --exclude=.env \
            build server config prisma src/shared package.json yarn.lock babel.config.js \
            .github/systemd/sandbox.service

      - name: Upload to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          port: ${{ vars.VPS_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy.tar.gz
          target: /tmp

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          DEPLOY_USER: ${{ vars.VPS_USER }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          port: ${{ vars.VPS_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_PATH,DEPLOY_USER
          script: |
            set -e
            mkdir -p "$DEPLOY_PATH"
            tar -xzf /tmp/deploy.tar.gz -C "$DEPLOY_PATH"
            rm /tmp/deploy.tar.gz
            cd "$DEPLOY_PATH"

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            # babel-node runtime needs devDependencies -> full install
            yarn install --frozen-lockfile --production=false

            # Install/update systemd unit and restart
            sed -e "s|{{VPS_DEPLOY_PATH}}|$DEPLOY_PATH|g" -e "s|{{VPS_USER}}|$DEPLOY_USER|g" \
              .github/systemd/sandbox.service | sudo tee /etc/systemd/system/sandbox.service > /dev/null
            sudo systemctl daemon-reload
            sudo systemctl enable sandbox
            sudo systemctl restart sandbox
